##############################################################################
# nginx.conf — Self-contained Nginx reverse proxy
#
# All proxy parameters are inlined — no external include files needed.
# This avoids Docker volume-mount issues on Windows Docker Desktop.
#
# Responsibilities:
#   1. Serve Angular SPA static files from /usr/share/nginx/html
#   2. Reverse-proxy /api/* to the Node.js backend container
#   3. Apply OWASP-recommended security headers
#   4. Gzip compression for performance
#   5. HTML5 pushState routing (all unknown paths → index.html)
##############################################################################

worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # ── MIME types & basics ──────────────────────────────────────────────────
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;   # Hide Nginx version in headers/error pages
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout    65;
    keepalive_requests   1000;
    client_max_body_size 10M;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr [$time_local] "$request" $status '
                    '$body_bytes_sent rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/xml image/svg+xml
        font/woff font/woff2;

    # ── Rate-limiting zones ──────────────────────────────────────────────────
    # General API:   20 req/s per IP
    limit_req_zone $binary_remote_addr zone=api:10m  rate=20r/s;
    # Auth endpoints: 5 req/min per IP  (brute-force protection)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # ── Backend upstream ─────────────────────────────────────────────────────
    upstream backend_api {
        server backend:3000;   # Docker DNS resolves 'backend' service name
        keepalive 32;
    }

    # ── HTTP server ──────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        root  /usr/share/nginx/html;
        index index.html;

        # ── Security headers ─────────────────────────────────────────────────
        add_header X-Content-Type-Options   "nosniff"                          always;
        add_header X-Frame-Options          "DENY"                             always;
        add_header X-XSS-Protection         "1; mode=block"                    always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' http://localhost http://localhost:3000; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
            always;

        # ── Health check (used by Docker healthcheck) ────────────────────────
        location = /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok"}';
        }

        # ── Auth endpoints — strict rate limit ───────────────────────────────
        # Exact-match locations are evaluated before prefix matches,
        # so these take priority over the general /api/ block below.
        location = /api/v1/auth/login {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
            proxy_buffering    off;
        }

        location = /api/v1/auth/register {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
            proxy_buffering    off;
        }

        # ── All other API routes — general rate limit ────────────────────────
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
            proxy_buffering    off;
        }

        # ── Static assets — aggressive caching ──────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Angular SPA — HTML5 pushState routing ────────────────────────────
        # Any path not matched above falls through to index.html so Angular
        # Router can handle client-side navigation.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma        "no-cache";
            add_header Expires       "0";
        }

        # ── Error pages ──────────────────────────────────────────────────────
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html { root /usr/share/nginx/html; }
    }
}
