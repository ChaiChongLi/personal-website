# Shared proxy settings — included by nginx.conf API location blocks

# Pass real client IP to backend (important for rate limiting and logging)
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Disable buffering for streaming responses (e.g., file downloads)
proxy_buffering off;

# Timeout settings — prevent hanging connections
proxy_connect_timeout 10s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

# Use HTTP/1.1 for keepalive connections to backend
proxy_http_version 1.1;
proxy_set_header Connection "";
